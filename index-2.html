<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="Control de asistentes CLUBEXA">
<link rel="manifest" href="manifest.webmanifest"><title>Asistentes CLUBEXA</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f5f7;margin:0;color:#17202a}main{max-width:720px;margin:auto;padding:16px}.top{position:sticky;top:0;background:#f4f5f7;padding:8px 0 12px;z-index:2}h1{font-size:24px;margin:4px 0}.stats{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin:8px 0}.stat{background:white;border-radius:10px;padding:7px 9px;box-shadow:0 1px 4px #0001}.actions,.filters{display:flex;gap:7px;flex-wrap:wrap}.actions button,.filters button{border:0;border-radius:10px;padding:9px 11px;background:#fff;box-shadow:0 1px 4px #0002;font-weight:600}.filters{margin:10px 0}.filters .active{outline:2px solid #555}.person{background:#fff;border-radius:13px;padding:10px;margin:7px 0;box-shadow:0 1px 4px #0002;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.name{font-weight:600;font-size:15px}.buttons{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.buttons button{border:0;border-radius:9px;padding:8px 7px;font-size:13px;background:#eee}.buttons .sel{outline:2px solid #333}.buttons .delete{background:#f7dddd}.small{font-size:12px;color:#687078;margin-top:10px;line-height:1.4}.notice{background:#fff8df;border-radius:11px;padding:9px 11px;margin:8px 0;font-size:13px}.hidden{display:none}
</style></head>
<body><main>
<div class="top"><h1>👥 Asistentes CLUBEXA</h1><div class="stats" id="stats"></div>
<div class="actions">
<button onclick="backup()">💾 Guardar copia</button><button onclick="document.getElementById('file').click()">📥 Recuperar copia</button><input id="file" type="file" accept="application/json" hidden onchange="restore(event)">
<button onclick="resetResponses()">♻️ Resetear respuestas</button><button id="restoreDeletedBtn" class="hidden" onclick="restoreDeleted()">↩️ Restaurar eliminados</button>
</div><div class="filters" id="filters"></div></div>
<div id="notice"></div><div id="list"></div>
<div class="small">Los cambios se guardan automáticamente. La copia JSON permite recuperar respuestas y jugadores eliminados aunque cambies de navegador o dispositivo.</div>
</main>
<script>
const NAMES=["Alfredo de la Fuente Mayan","Tomas Bodelon Rodriguez","Jorge Graña Lois","Bernard Sakulski","Fernando Jose Casares Ripol","Manuel Ramon Arias Rodriguez","Diego Fernandez Iglesias","Enrique Villodas Vazquez","Carlos Viñas Lopez","Eduardo Rodriguez Crespo","Ricardo Vilariño Gestal","Carlos Fustes Pardo","Daniel Figueiras Arias","Jose Maria Gonzalez Prida","Gregorio Saavedra Carballido","Jose Luis Somoza Digon","Daniel Pousada Estevez","Javier Seijo Beltran","Celestino Redondo Varela","Lazaro Asensio Hernandez","Jose Maria Dorado Reboredo","Alejandro Villodas Vazquez","Breixo Formoso López","Manuel Fulgencio Esteve Perez","Juan Carlos Siso Lale","Jose Manuel Mosqueira Varela","Julio Bugliot Lage","Roberto Juan Jose Garcia Martinez","Angel Rey Fariña","Geiler Jose Orta Carriaga","Maria Jose Lara Folgar","Samuel Cambeiro Carril","Pablo Sergio Rodríguez Montero","Juan Manuel Gómez Galeano","Francisco Javier Toba Blanco","Mauro Atahualpa Condezo","Juan Novoa Sabin","Adrian Rey Reiriz","Antón Somoza Naveira","Fernando Jose García Pérez"];
const KEY='clubexa_asistentes_v2', OLD_KEY='clubexa_asistentes_v1';
let state=load();let people=state.people,deleted=state.deleted,filter='all';
function defaults(){return NAMES.map((name,i)=>({id:i+1,name,status:null}))}
function normalize(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function countAnswered(a){return (a||[]).filter(x=>['yes','no','maybe'].includes(x.status)).length}
function merge(raw,del){const d=new Set((del||[]).map(normalize));let out=defaults().filter(x=>!d.has(normalize(x.name)));let m=new Map((raw||[]).map(x=>[normalize(x.name),x.status]));out.forEach(x=>{let s=m.get(normalize(x.name));if(['yes','no','maybe'].includes(s))x.status=s});return out}
function parseState(raw){if(!raw)return null;try{let x=JSON.parse(raw);if(Array.isArray(x))return {people:x,deleted:[]};if(Array.isArray(x.people))return {people:x.people,deleted:Array.isArray(x.deleted)?x.deleted:[]};}catch(e){}return null}
function load(){try{let a=parseState(localStorage.getItem(KEY)),b=parseState(localStorage.getItem(OLD_KEY)),c=parseState(localStorage.getItem('clubexa_backup_v2')),cands=[a,b,c].filter(Boolean);if(!cands.length)return {people:defaults(),deleted:[]};cands.sort((x,y)=>countAnswered(y.people)-countAnswered(x.people));let s=cands[0];return {people:merge(s.people,s.deleted),deleted:[...(s.deleted||[])]}}catch(e){return {people:defaults(),deleted:[]}}}
function save(){let payload={app:'clubexa-asistentes',version:2,savedAt:new Date().toISOString(),people,deleted};try{localStorage.setItem(KEY,JSON.stringify(payload));localStorage.setItem('clubexa_backup_v2',JSON.stringify(payload));localStorage.setItem(OLD_KEY,JSON.stringify(payload));}catch(e){}}
function setStatus(i,s){people[i].status=people[i].status===s?null:s;save();render()}
function removePerson(i){const p=people[i];if(!confirm('¿Eliminar a '+p.name+' de la lista?'))return;deleted.push(p.name);people.splice(i,1);save();render()}
function restoreDeleted(){if(!deleted.length)return;if(!confirm('¿Restaurar todos los jugadores eliminados?'))return;deleted=[];people=merge([],[]);save();render()}
function resetResponses(){if(!confirm('¿Borrar todas las respuestas y conservar los jugadores actuales?'))return;people.forEach(p=>p.status=null);save();render()}
function render(){let c={yes:0,no:0,maybe:0,null:0};people.forEach(p=>c[p.status??'null']++);document.getElementById('stats').innerHTML=`<span class=stat>🟢 ${c.yes}</span><span class=stat>🔴 ${c.no}</span><span class=stat>🟡 ${c.maybe}</span><span class=stat>⚪ ${c.null}</span><span class=stat>👥 ${people.length} jugadores</span>`;document.getElementById('restoreDeletedBtn').classList.toggle('hidden',deleted.length===0);document.getElementById('notice').innerHTML=deleted.length?`<div class=notice>🗑️ Hay <b>${deleted.length}</b> jugador(es) eliminado(s). Puedes restaurarlos cuando quieras.</div>`:'';document.getElementById('filters').innerHTML=[['all','Todos'],['yes','🟢 Sí'],['no','🔴 No'],['maybe','🟡 Dudoso'],['null','⚪ Sin respuesta']].map(([v,t])=>`<button class="${filter===v?'active':''}" onclick="filter='${v}';render()">${t}</button>`).join('');document.getElementById('list').innerHTML=people.map((p,i)=>{let show=filter==='all'||(p.status??'null')===filter;return show?`<div class=person><span class=name>${p.name}</span><span class=buttons><button class="${p.status==='yes'?'sel':''}" onclick="setStatus(${i},'yes')">🟢 Sí</button><button class="${p.status==='no'?'sel':''}" onclick="setStatus(${i},'no')">🔴 No</button><button class="${p.status==='maybe'?'sel':''}" onclick="setStatus(${i},'maybe')">🟡 Dudoso</button><button class=delete onclick="removePerson(${i})" title="Eliminar jugador">🗑️</button></span></div>`:''}).join('')}
function backup(){let blob=new Blob([JSON.stringify({app:'clubexa-asistentes',version:2,savedAt:new Date().toISOString(),people,deleted},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='copia-asistentes-clubexa.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.people))throw 0;deleted=Array.isArray(x.deleted)?x.deleted:[];people=merge(x.people,deleted);save();render();alert('Copia recuperada correctamente.')}catch(_){alert('La copia no es válida.')}};r.readAsText(f);e.target.value=''}
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
