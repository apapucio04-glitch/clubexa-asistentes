<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="Control de asistentes CLUBEXA"><link rel="manifest" href="manifest.webmanifest"><title>Asistentes CLUBEXA</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f5f7;margin:0;color:#17202a}main{max-width:680px;margin:auto;padding:16px}.top{position:sticky;top:0;background:#f4f5f7;padding:8px 0 12px;z-index:2}h1{font-size:24px;margin:4px 0}.stats{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin:8px 0}.stat{background:white;border-radius:10px;padding:7px 9px;box-shadow:0 1px 4px #0001}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button,.filters button{border:0;border-radius:10px;padding:9px 11px;background:#fff;box-shadow:0 1px 4px #0002;font-weight:600}.filters{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.filters .active{outline:2px solid #555}.person{background:#fff;border-radius:13px;padding:10px;margin:7px 0;box-shadow:0 1px 4px #0002;display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-weight:600;font-size:15px}.buttons{display:flex;gap:5px}.buttons button{border:0;border-radius:9px;padding:8px 7px;font-size:13px;background:#eee}.buttons .sel{outline:2px solid #333}.small{font-size:12px;color:#687078;margin-top:7px}dialog{border:0;border-radius:15px;padding:20px;max-width:90%}dialog::backdrop{background:#0006}dialog button{padding:10px;border:0;border-radius:9px;margin:5px}</style></head><body><main><div class="top"><h1>👥 Asistentes CLUBEXA</h1><div class="stats" id="stats"></div><div class="actions"><button onclick="backup()">💾 Guardar copia</button><button onclick="document.getElementById('file').click()">📥 Recuperar copia</button><input id="file" type="file" accept="application/json" hidden onchange="restore(event)"><button onclick="resetResponses()">♻️ Resetear</button></div><div class="filters" id="filters"></div></div><div id="list"></div><div class="small">Los cambios se guardan automáticamente en este dispositivo. La copia JSON permite recuperar la lista incluso si cambia el navegador.</div></main><script>
const NAMES=["Alfredo de la Fuente Mayan","Tomas Bodelon Rodriguez","Jorge Graña Lois","Bernard Sakulski","Fernando Jose Casares Ripol","Manuel Ramon Arias Rodriguez","Diego Fernandez Iglesias","Enrique Villodas Vazquez","Carlos Viñas Lopez","Eduardo Rodriguez Crespo","Ricardo Vilariño Gestal","Carlos Fustes Pardo","Daniel Figueiras Arias","Jose Maria Gonzalez Prida","Gregorio Saavedra Carballido","Jose Luis Somoza Digon","Daniel Pousada Estevez","Javier Seijo Beltran","Celestino Redondo Varela","Lazaro Asensio Hernandez","Jose Maria Dorado Reboredo","Alejandro Villodas Vazquez","Breixo Formoso López","Manuel Fulgencio Esteve Perez","Juan Carlos Siso Lale","Jose Manuel Mosqueira Varela","Julio Bugliot Lage","Roberto Juan Jose Garcia Martinez","Angel Rey Fariña","Geiler Jose Orta Carriaga","Maria Jose Lara Folgar","Samuel Cambeiro Carril","Pablo Sergio Rodríguez Montero","Juan Manuel Gómez Galeano","Francisco Javier Toba Blanco","Mauro Atahualpa Condezo","Juan Novoa Sabin","Adrian Rey Reiriz","Antón Somoza Naveira","Fernando Jose García Pérez"];
const KEY='clubexa_asistentes_v1';let people=load();let filter='all';
function defaults(){return NAMES.map((name,i)=>({id:i+1,name,status:null}))}
function normalize(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function merge(a){let out=defaults(),m=new Map((a||[]).map(x=>[normalize(x.name),x.status]));out.forEach(x=>{let s=m.get(normalize(x.name));if(['yes','no','maybe'].includes(s))x.status=s});return out}
function load(){try{let a=JSON.parse(localStorage.getItem(KEY)||'null');return merge(Array.isArray(a)?a:[])}catch(e){return defaults()}}
function save(){localStorage.setItem(KEY,JSON.stringify(people));}
function setStatus(i,s){people[i].status=people[i].status===s?null:s;save();render()}
function render(){let c={yes:0,no:0,maybe:0,null:0};people.forEach(p=>c[p.status??'null']++);document.getElementById('stats').innerHTML=`<span class=stat>🟢 ${c.yes}</span><span class=stat>🔴 ${c.no}</span><span class=stat>🟡 ${c.maybe}</span><span class=stat>⚪ ${c.null}</span>`;document.getElementById('filters').innerHTML=[['all','Todos'],['yes','🟢 Sí'],['no','🔴 No'],['maybe','🟡 Dudoso'],['null','⚪ Sin respuesta']].map(([v,t])=>`<button class="${filter===v?'active':''}" onclick="filter='${v}';render()">${t}</button>`).join('');document.getElementById('list').innerHTML=people.map((p,i)=>[p.status??'null'].includes(filter)||filter==='all'?`<div class=person><span class=name>${p.name}</span><span class=buttons><button class="${p.status==='yes'?'sel':''}" onclick="setStatus(${i},'yes')">🟢 Sí</button><button class="${p.status==='no'?'sel':''}" onclick="setStatus(${i},'no')">🔴 No</button><button class="${p.status==='maybe'?'sel':''}" onclick="setStatus(${i},'maybe')">🟡 Dudoso</button></span></div>`:'').join('')}
function backup(){let blob=new Blob([JSON.stringify({app:'clubexa-asistentes',version:1,savedAt:new Date().toISOString(),people},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='copia-asistentes-clubexa.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.people))throw 0;people=merge(x.people);save();render();alert('Copia recuperada correctamente.')}catch(_){alert('La copia no es válida.')}};r.readAsText(f);e.target.value=''}
function resetResponses(){if(confirm('¿Borrar todas las respuestas y conservar los 40 nombres?')){people=defaults();save();render()}}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
